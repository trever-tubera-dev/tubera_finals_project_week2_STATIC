<h1>Contact</h1>
<p class="muted">Suggest a release, report a problem, or just say hi.</p>
<form class="guestbook" action="#" method="post">
<label for="c-name">Full Name</label>
<input type="text" id="c-name" name="name" required>
<label for="c-email">Email Address</label>
<input type="email" id="c-email" name="email" required>
<label for="c-message">Message</label>
<textarea id="c-message" name="message" rows="4" required></textarea>
<button class="btn" type="submit">Send message</button>
</form>
